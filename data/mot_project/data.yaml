path: ../  # dataset root dir (relative to this yaml file — points to data/ which contains images/ and labels/)
train: images/train  # train images (relative to path)
val: images/val  # val images (relative to path)
test: images/test  # test images (optional, relative to path)

# Classes
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
  10: others
